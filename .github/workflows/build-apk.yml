
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'perfume_manager_flutter_source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract and locate project
        run: |
          unzip -q perfume_manager_flutter_source.zip -d work
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/work" -type f -name pubspec.yaml -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found"
            find work -maxdepth 4 -type f
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Android
        run: flutter create --platforms=android .
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Get dependencies
        run: flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build APK
        run: flutter build apk --release
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: perfume-manager-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          
